<header class="masthead">
  <div class="wrap masthead-inner">

    <a class="wordmark" href="{{ '/' | relative_url }}">
      <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2 20 L8 12 L14 15 L22 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Analyst Automates</span>
    </a>

    <nav class="nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign target = item.link | relative_url %}
        <a href="{{ target }}"{% if page.url == item.link %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <a class="nav-out" href="{{ site.github_url }}" rel="noopener">GitHub</a>
    </nav>

  </div>
</header>
